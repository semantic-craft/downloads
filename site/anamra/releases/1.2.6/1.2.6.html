<h2>Anamra 1.2.6 · 安记</h2>
<p>本次更新修复 Google 同步设置中的日志隐私问题。Google 同步仍处于测试状态。</p>

<h3>Google 同步隐私修复</h3>
<ul>
<li>Google 容器列表恢复、刷新或断开时，设置页不再把原始容器标识交给系统界面诊断；已保存的同步目标保持不变，并会在容器恢复后重新显示。</li>
</ul>
