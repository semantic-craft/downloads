<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<title>Anamra 1.2.7</title></head><body style="font:14px -apple-system;color:#222">
<h2>Anamra 1.2.7 · 安记</h2>
<p>本次更新改进截图标注的工具栏与文字附注体验，并把自动更新迁移到新的分发通道。</p>

<h3>截图标注</h3>
<ul>
<li>工具栏整体放大：图标更大、点击区域更宽，悬停每个工具会浮出一句话用途说明与快捷键。</li>
<li>文字工具图标改为通行的「T」字样，不再显示为「格式」。</li>
<li>文字附注支持二次编辑：双击已有文字即可原位修改，文字工具下点到已有文字也是修改而非叠加；清空内容即删除该条。</li>
</ul>

<h3>自动更新</h3>
<ul>
<li>更新源迁移至 downloads.responsay.com。本版本安装后将从新通道接收后续更新，无需任何手动操作。</li>
</ul>
</body></html>
